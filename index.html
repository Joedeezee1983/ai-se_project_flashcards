<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards App</title>

    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">Flash Cards</h1>

      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">Flash cards</a></li>
          <li><a class="nav__link" href="#home">My decks</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page__main-content">
      <!-- ===========================
           HOME / GALLERY SECTION
      ============================ -->
      <section id="home" class="gallery">
        <h2 class="gallery__title">Your Decks</h2>

        <div class="gallery__wrapping-row">
          <button class="gallery__new-card-btn" type="button">
            + New Card
          </button>

          <ul
            id="decksList"
            class="gallery__list gallery__list_display-contents"
          ></ul>

          <!-- Deck Card Template -->
          <template id="deck-template">
            <li class="card card_color_green">
              <a class="card__link" href="#"></a>
              <h3 class="card__title"></h3>
              <div class="card__row">
                <p class="card__count"></p>
                <button class="card__btn card__btn_type_delete"></button>
              </div>
            </li>
          </template>
        </div>
      </section>

      <!-- ===========================
           DECK VIEW SECTION
      ============================ -->
      <section id="deck-view" class="gallery">
        <div class="gallery__header-row">
          <h2 class="gallery__title"></h2>

          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>

        <div class="gallery__wrapping-row">
          <button class="gallery__new-card-btn" type="button">
            + New Card
          </button>

          <ul
            id="cardsList"
            class="gallery__list gallery__list_display-contents"
          ></ul>

          <!-- Flashcard Template -->
          <template id="card-template">
            <li class="card card_color_green">
              <h3 class="card__title"></h3>
              <div class="card__row">
                <button
                  type="button"
                  class="card__action-btn"
                  aria-label="Show answer"
                >
                  Show answer
                </button>
                <button
                  type="button"
                  class="card__btn card__btn_type_delete"
                  aria-label="Delete card"
                ></button>
              </div>
            </li>
          </template>
        </div>
      </section>

      <!-- ===========================
           CAROUSEL SECTION
      ============================ -->
      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>

        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>

        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>

      <!-- ===========================
           404 SECTION
      ============================ -->
      <section id="notfound" class="notfound">
        <h2>404 — Not Found</h2>
        <p>The page you requested could not be found.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards App</p>
    </footer>

    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
