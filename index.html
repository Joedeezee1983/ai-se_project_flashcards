<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A flashcard app for studying and reviewing your decks."
    />
    <title>Flash Cards App</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>

  <body class="page">
    <div class="page__container">
      <header class="header">
        <h1 class="header__title">Flash Cards</h1>

        <nav class="nav">
          <ul class="nav__links">
            <li><a class="nav__link" href="#home">My Decks</a></li>
            <li>
              <a class="nav__link" href="#home" aria-label="About the app"
                >About</a
              >
            </li>
          </ul>
        </nav>
      </header>

      <main id="main" class="page__main-content" aria-live="polite">
        <!-- ===========================
           HOME / GALLERY SECTION
      ============================ -->
        <section id="home" class="gallery">
          <h2 class="gallery__title">My Decks</h2>

          <div class="gallery__wrapping-row">
            <ul id="decksList" class="gallery__list">
              <li>
                <button class="gallery__new-card-btn" type="button">
                  + New Deck
                </button>
              </li>
            </ul>
          </div>
        </section>

        <!-- ===========================
           DECK VIEW SECTION
      ============================ -->
        <section id="deck-view" class="deck-view">
          <div class="gallery__header-row">
            <h2 class="gallery__title"></h2>

            <button class="gallery__practice-btn" type="button">
              Practice
            </button>
          </div>

          <div class="gallery__wrapping-row">
            <ul id="cardsList" class="gallery__list">
              <li>
                <button class="gallery__new-card-btn" type="button">
                  + New Card
                </button>
              </li>
            </ul>
          </div>
        </section>

        <!-- ===========================
           CAROUSEL SECTION
      ============================ -->
        <section id="carousel" class="carousel">
          <h2 class="carousel__title"></h2>

          <div class="carousel__row">
            <button
              class="carousel__btn carousel__btn_type_left"
              type="button"
              aria-label="Previous card"
              disabled
            ></button>

            <div class="carousel__card">
              <p class="carousel__card-text"></p>
            </div>

            <button
              class="carousel__btn carousel__btn_type_right"
              type="button"
              aria-label="Next card"
            ></button>
          </div>

          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip card"
          ></button>
        </section>

        <!-- ===========================
           404 SECTION
      ============================ -->
        <section id="not-found" class="not-found">
          <h2>404 — Not Found</h2>
          <p>The page you requested could not be found.</p>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__text">&copy; 2026 Flash Cards App</p>
      </footer>
    </div>
    <!-- /.page__container -->

    <!-- ===========================
         TEMPLATES
    ============================ -->

    <!-- Deck Card Template -->
    <template id="deck-template">
      <li class="card">
        <a class="card__link" href="#"></a>
        <h3 class="card__title"></h3>
        <div class="card__row">
          <span class="card__count"></span>
          <button
            type="button"
            class="card__btn card__btn_type_delete"
            aria-label="Delete deck"
          ></button>
        </div>
      </li>
    </template>

    <!-- Flashcard Template -->
    <template id="card-template">
      <li class="card">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <button
            type="button"
            class="card__btn card__btn_type_flip"
            aria-label="Flip card"
          ></button>

          <button
            type="button"
            class="card__btn card__btn_type_delete"
            aria-label="Delete card"
          ></button>
        </div>
      </li>
    </template>

    <script type="module" src="./assets/js/index.js"></script>

    <!-- ===========================
         CONFIRMATION MODAL
    ============================ -->
    <div
      id="confirm-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-message"
    >
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <p id="modal-message" class="modal__message">
          Are you sure you want to delete this?
        </p>
        <div class="modal__actions">
          <button
            type="button"
            id="modal-confirm"
            class="modal__btn modal__btn_type_confirm"
          >
            Delete
          </button>
          <button
            type="button"
            id="modal-cancel"
            class="modal__btn modal__btn_type_cancel"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
