<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards App</title>

    <!-- Corrected CSS path -->
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">Flash Cards</h1>

      <nav class="nav">
        <ul class="nav__links">
          <!-- Corrected nav links per project requirements -->
          <li><a class="nav__link" href="#home">Flash cards</a></li>
          <li><a class="nav__link" href="#home">My decks</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page__main-content">
      <!-- Home Section -->
      <section id="home">
        <h2 class="decks__title">Your Decks</h2>

        <div class="decks__wrapping-row">
          <button class="decks__new-deck-btn" type="button">+ New Deck</button>

          <ul
            id="decksList"
            class="decks__list decks__list_display-contents"
          ></ul>

          <!-- REQUIRED TEMPLATE (Fix for deckTemplate null error) -->
          <template id="deck-template">
            <li class="deck deck_color_green">
              <a class="deck__link" href="#"></a>
              <h3 class="deck__title"></h3>
              <div class="deck__row">
                <p class="deck__count"></p>
                <button class="deck__delete-btn" type="button"></button>
              </div>
            </li>
          </template>
        </div>
      </section>

      <!-- Carousel Section -->
      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>

        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>

        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>

      <!-- 404 Not Found -->
      <section id="notfound" class="notfound">
        <h2>404 — Not Found</h2>
        <p>The page you requested could not be found.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards App</p>
    </footer>

    <!-- Corrected script path -->
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
