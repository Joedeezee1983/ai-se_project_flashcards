<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A flashcard app for studying and reviewing your decks."
    />
    <title>Flash Cards App</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="page">
    <header class="header">
      <a class="nav__link" href="#home">
        <h1 class="header__title">Flash Cards</h1>
      </a>

      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li>
            <a class="nav__link" href="#home" aria-label="About the app"
              >About</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page__main-content" aria-live="polite">
      <!-- ===========================
           HOME / GALLERY SECTION
      ============================ -->
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>

        <div class="gallery__wrapping-row">
          <ul id="decksList" class="gallery__list">
            <li class="gallery__new-card-item">
              <button class="gallery__new-card-btn" type="button">
                + New Deck
              </button>
            </li>
          </ul>
        </div>
      </section>

      <!-- ===========================
           NEW DECK VIEW SECTION
      ============================ -->
      <section class="new-deck-view" id="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>

        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__color-legend">
              Pick the deck color
            </legend>

            <div class="new-deck-view__color-options">
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-green"
                value="#64d583"
                aria-label="green"
                checked
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_green"
                for="deck-color-green"
              ></label>

              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-blue"
                value="#91a8f9"
                aria-label="blue"
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_blue"
                for="deck-color-blue"
              ></label>

              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-pink"
                value="#ee92d7"
                aria-label="pink"
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_pink"
                for="deck-color-pink"
              ></label>

              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-purple"
                value="#aa8ef0"
                aria-label="purple"
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_purple"
                for="deck-color-purple"
              ></label>

              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-orange"
                value="#ee955e"
                aria-label="orange"
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_orange"
                for="deck-color-orange"
              ></label>

              <input
                class="new-deck-view__color-input"
                type="radio"
                name="deck-color"
                id="deck-color-yellow"
                value="#f5d770"
                aria-label="yellow"
              />
              <label
                class="new-deck-view__color-swatch new-deck-view__color-swatch_color_yellow"
                for="deck-color-yellow"
              ></label>
            </div>
          </fieldset>

          <label class="new-deck-view__text-label" for="new-deck-json">
            Write the JSON array of cards so that it matches this schema
            <textarea
              class="new-deck-view__textarea"
              id="new-deck-json"
              name="cards-json"
              placeholder='[{"question":"...","answer":"..."}]'
              rows="10"
            ></textarea>
          </label>

          <button
            class="new-deck-view__submit-btn"
            type="submit"
            id="new-deck-submit"
            disabled
          >
            Create the Deck
          </button>
        </form>
      </section>

      <!-- ===========================
           DECK VIEW SECTION
      ============================ -->
      <section id="deck-view" class="deck-view">
        <div class="gallery__header-row">
          <h2 class="gallery__title"></h2>

          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>

        <div class="gallery__wrapping-row">
          <ul id="cardsList" class="gallery__list">
            <li class="gallery__new-card-item">
              <button class="gallery__new-card-btn" type="button">
                + New Card
              </button>
            </li>
          </ul>
        </div>
      </section>

      <!-- ===========================
           CAROUSEL SECTION
      ============================ -->
      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>

        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>

        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>

      <!-- ===========================
           404 SECTION
      ============================ -->
      <section id="not-found" class="not-found">
        <h2>404 — Not Found</h2>
        <p>The page you requested could not be found.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards App</p>
    </footer>

    <!-- ===========================
         TEMPLATES
    ============================ -->

    <!-- Deck Card Template -->
    <template id="deck-template">
      <li class="card">
        <a class="card__link" href="#"></a>
        <h3 class="card__title"></h3>
        <div class="card__row">
          <span class="card__count"></span>
          <button
            type="button"
            class="card__btn card__btn_type_delete"
            aria-label="Delete deck"
          ></button>
        </div>
      </li>
    </template>

    <!-- Flashcard Template -->
    <template id="card-template">
      <li class="card">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <button
            type="button"
            class="card__btn card__btn_type_flip"
            aria-label="Flip card"
          ></button>

          <button
            type="button"
            class="card__btn card__btn_type_delete"
            aria-label="Delete card"
          ></button>
        </div>
      </li>
    </template>

    <script type="module" src="./assets/js/index.js"></script>

    <!-- ===========================
         CONFIRMATION MODAL
    ============================ -->
    <div
      id="confirm-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-message"
    >
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <p id="modal-message" class="modal__message">
          Are you sure you want to delete this deck?
        </p>
        <div class="modal__actions">
          <button
            type="button"
            id="modal-cancel"
            class="modal__btn modal__btn_type_cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            id="modal-confirm"
            class="modal__btn modal__btn_type_confirm"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <div
      id="error-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="error-modal-message"
    >
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <p id="error-modal-message" class="modal__error"></p>
        <div class="modal__actions">
          <button
            type="button"
            id="error-modal-dismiss"
            class="modal__btn modal__btn_type_confirm"
          >
            Dismiss
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
